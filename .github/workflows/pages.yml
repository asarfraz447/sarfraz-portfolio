name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download complete website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --clobber --repo "$GITHUB_REPOSITORY" --pattern portfolio.tar.gz --pattern portfolio.sha256
          sha256sum -c portfolio.sha256
          tar -xzf portfolio.tar.gz
          test -f dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
